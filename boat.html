<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boat Details | MyCharters Malta</title>
<meta name="description" content="Private charter boat in Malta: prices, what's included, availability and booking.">
<meta name="theme-color" content="#0E3456">
<link rel="icon" type="image/png" href="mycharters-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="broker.css">
</head>
<body>

<header>
  <div class="container row">
    <a href="index.html" class="logo" aria-label="MyCharters home">
      <img class="logo-mark" src="mycharters-logo.png" alt="">
      <span class="logo-word">My<span>Charters</span></span>
    </a>
    <nav class="hlinks" aria-label="Main">
      <a class="opt" href="index.html#how">How it works</a>
      <a href="fleet.html">Fleet</a>
      <a class="opt" href="index.html#partners">List your boat</a>
    </nav>
  </div>
</header>

<main>
  <div class="container" id="root"></div>
</main>

<footer>
  © <span id="year"></span> MyCharters · <a href="index.html">Home</a> · <a href="fleet.html">Fleet</a>
</footer>

<script src="fleet.js"></script>
<script>
const { esc } = MC;
document.getElementById("year").textContent = new Date().getFullYear();
const CHECK = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const root = document.getElementById("root");
const boat = MC.get(new URLSearchParams(location.search).get("boat"));

if (!boat) {
  root.innerHTML = `<div class="empty glass" style="margin-top:80px">
    <h3>We couldn't find that boat</h3>
    <p>It may have been booked out for the season or renamed. Have a look at the rest of the fleet.</p>
    <a class="btn btn-coral" href="fleet.html">Browse the fleet</a>
  </div>`;
} else {
  document.title = `${boat.name} | Private Charter in Malta | MyCharters`;
  document.querySelector('meta[name="description"]').content = `${boat.name}: private ${boat.type.toLowerCase()} charter from ${boat.marina} for up to ${boat.guests} guests. ${boat.summary}`.slice(0, 160);
  const from = MC.fromPrice(boat);
  const bookHref = `booking.html?boat=${encodeURIComponent(boat.id)}`;

  root.innerHTML = `
    <p class="crumbs"><a href="fleet.html">Fleet</a> / ${esc(boat.name)}</p>
    ${boat.sample ? '<p class="sample-note">This is a <b>sample listing</b> shown only in preview mode. It is not a real boat.</p>' : ""}
    <div class="detail">
      <div>
        <div class="gallery-main">
          <img id="mainImg" src="${esc(boat.photos[0])}" alt="${esc(boat.name)}">
          ${boat.sample ? '<span class="sample-badge">Sample listing</span>' : ""}
        </div>
        ${boat.photos.length > 1 ? `<div class="thumbs" role="group" aria-label="Photos">${boat.photos.map((p, i) =>
          `<button type="button" aria-pressed="${i === 0}" data-src="${esc(p)}" aria-label="Photo ${i + 1}"><img src="${esc(p)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}

        <p class="eyebrow" style="margin-top:34px">${esc(boat.type)} · Operated by ${esc(boat.operator)}</p>
        <h1 class="d-title">${esc(boat.name)}</h1>
        <p class="d-sum">${esc(boat.summary)}</p>

        ${boat.specs && boat.specs.length ? `<div class="panel glass">
          <h2>Specifications</h2>
          <ul class="price-list">${boat.specs.map(([k, v]) =>
            `<li><span>${esc(k)}</span><span class="spec-v">${esc(v)}</span></li>`).join("")}</ul>
        </div>` : ""}

        <div class="panel glass">
          <h2>Charters &amp; prices</h2>
          <ul class="price-list">${boat.charters.map((c) =>
            `<li><span>${esc(c.name)}<small>${esc(c.duration)}</small></span><b>${c.price == null ? esc(c.priceLabel || "Price on request") : "from " + MC.euro(c.price)}</b></li>`).join("")}</ul>
        </div>

        <div class="panel glass">
          <h2>What's included</h2>
          <ul class="incl">${boat.includes.map((t) => `<li>${CHECK}<span>${esc(t)}</span></li>`).join("")}</ul>
        </div>

        ${boat.skipper ? `<div class="panel glass">
          <h2>Your skipper</h2>
          <div class="skipper" style="margin-top:14px">
            <img src="${esc(boat.skipper.photo)}" alt="${esc(boat.skipper.name)}" loading="lazy">
            <div><strong>${esc(boat.skipper.name)}</strong><p>${esc(boat.skipper.bio)}</p></div>
          </div>
        </div>` : ""}
      </div>

      <aside class="book-box">
        <div class="panel glass" style="margin-top:0">
          <p class="eyebrow">${from == null ? "Price" : "From"}</p>
          <p class="d-title" style="margin-top:6px;color:var(--coral-light)">${from == null ? "On request" : MC.euro(from)}</p>
          <div class="meta">
            <span>Up to ${boat.guests} guests</span><span>${esc(boat.length)}</span><span>${esc(boat.marina)}</span>
          </div>
          <a class="btn btn-coral" href="${bookHref}">Book this boat</a>
          <p class="dep">Secure your date with a €${boat.deposit} deposit. ${esc(boat.operator)} confirms your booking; if the boat turns out to be unavailable, your deposit is refunded in full.</p>
        </div>
        <div class="panel glass">
          <h2>Availability</h2>
          <div id="cal"></div>
        </div>
      </aside>
    </div>`;

  // photo switcher
  root.querySelectorAll(".thumbs button").forEach((b) => b.addEventListener("click", () => {
    document.getElementById("mainImg").src = b.dataset.src;
    root.querySelectorAll(".thumbs button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));

  // read-only availability calendar
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  let cur = new Date(); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const calEl = document.getElementById("cal");
  function renderCal() {
    const booked = MC.bookedSet(boat);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const canPrev = cur > new Date(today.getFullYear(), today.getMonth(), 1);
    const off = (cur.getDay() + 6) % 7, days = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
    let h = `<div class="cal-head"><button type="button" class="cal-nav" data-nav="-1" ${canPrev ? "" : "disabled"} aria-label="Previous month">‹</button><span class="cal-title">${MONTHS[cur.getMonth()]} ${cur.getFullYear()}</span><button type="button" class="cal-nav" data-nav="1" aria-label="Next month">›</button></div><div class="cal-grid">`;
    ["Mo","Tu","We","Th","Fr","Sa","Su"].forEach((d) => h += `<span class="cal-dow">${d}</span>`);
    for (let i = 0; i < off; i++) h += "<span></span>";
    for (let d = 1; d <= days; d++) {
      const date = new Date(cur.getFullYear(), cur.getMonth(), d), k = iso(date);
      const cls = ["cal-day"]; if (date < today) cls.push("past"); if (booked.has(k)) cls.push("booked");
      h += `<span class="${cls.join(" ")}"${booked.has(k) ? ' aria-label="' + k + ' booked"' : ""}>${d}</span>`;
    }
    h += `</div><div class="cal-legend"><span>Available</span><span><span class="bx">15</span> Booked</span></div>`;
    calEl.innerHTML = h;
    calEl.querySelectorAll("[data-nav]").forEach((b) => b.onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + Number(b.dataset.nav), 1); renderCal(); });
  }
  renderCal();
}
</script>
</body>
</html>
